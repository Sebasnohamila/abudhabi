<a-assets>
    <video id="vid" src="assets/asset.mp4" 
           preload="auto" loop crossorigin 
           webkit-playsinline playsinline muted></video> <a-asset-item id="miModelo" src="assets/mi-modelo.glb"></a-asset-item>
</a-assets>

<a-scene
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false;"
    arjs='sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;'
    renderer="antialias: false; precision: lowp;" 
    id="scene" embedded gesture-detector
>
    <a-marker
        type="pattern" preset="custom" url="assets/marker.patt"
        videohandler 
        smooth="true" smoothCount="5" id="markerA"
    >
        <a-video
            src="#vid"
            fix-video-size
            position="0 0 0" 
            rotation="-90 0 0"
            material="shader: flat; src: #vid;" ></a-video>
        ...
    </a-marker>
</a-scene>

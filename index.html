<style>
    #splash-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: white; z-index: 9999;
        display: flex; justify-content: center; align-items: center;
        transition: opacity 1s ease-out;
    }
    #splash-screen img { max-width: 60%; height: auto; }
    .arjs-ready #splash-screen { opacity: 0; pointer-events: none; }

    /* Estilo base para el video */
    #fullScreenVideo {
        display: none; 
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        object-fit: contain; /* Cambiado a contain para ver el video completo */
        background-color: black;
    }

    /* Si la pantalla es VERTICAL (Retrato) */
    @media (orientation: portrait) {
        #fullScreenVideo {
            object-fit: contain; /* Ajusta el video al ancho disponible */
        }
    }

    /* Si la pantalla es HORIZONTAL (Paisaje) */
    @media (orientation: landscape) {
        #fullScreenVideo {
            object-fit: contain; /* Ajusta el video a la altura disponible */
        }
    }

    .a-canvas {
        z-index: 2 !important;
    }
</style>

<script>
    AFRAME.registerComponent('videohandler', {
        init: function () {
            var marker = this.el;
            this.vid = document.querySelector("#fullScreenVideo");
            this.modelContainer = document.querySelector("#gui-container"); 

            marker.addEventListener('markerFound', function () {
                this.vid.style.display = 'block';
                // Intentar reproducir (algunos navegadores requieren interacción previa)
                this.vid.play().catch(e => console.log("Esperando interacción para audio"));
                this.modelContainer.setAttribute('visible', 'true');
            }.bind(this));
        },
    });

    window.addEventListener('arjs-video-loaded', function(e) {
        setTimeout(() => { document.body.classList.add('arjs-ready'); }, 1000);
    });
</script>

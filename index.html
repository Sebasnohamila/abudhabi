<!doctype html>
<html>
<head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: white; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1s ease-out;
        }
        #splash-screen img { max-width: 60%; height: auto; }
        .arjs-ready #splash-screen { opacity: 0; pointer-events: none; }

        /* Estilo corregido para rotación de 90 grados */
        #fullScreenVideo {
            display: none; 
            position: fixed;
            top: 50%;
            left: 50%;
            /* Al rotar 90 grados, intercambiamos el ancho por el alto visualmente */
            width: 100vh; 
            height: 100vw;
            object-fit: cover;
            z-index: 1;
            /* Centramos y rotamos */
            transform: translate(-50%, -50%) rotate(90deg);
        }

        .a-canvas {
            z-index: 2 !important;
        }
    </style>

    <script>
        AFRAME.registerComponent('videohandler', {
            init: function () {
                var marker = this.el;
                this.vid = document.querySelector("#fullScreenVideo");
                this.modelContainer = document.querySelector("#gui-container"); 

                marker.addEventListener('markerFound', function () {
                    this.vid.style.display = 'block';
                    this.vid.play();
                    this.modelContainer.setAttribute('visible', 'true');
                }.bind(this));

                marker.addEventListener('markerLost', function () {
                    // Se mantiene visible
                }.bind(this));
            },
        });

        window.addEventListener('arjs-video-loaded', function(e) {
            setTimeout(() => { document.body.classList.add('arjs-ready'); }, 1000);
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">
    <div id="splash-screen"><img src="assets/logo.png" alt="Cargando..."></div>

    <video id="fullScreenVideo" src="assets/asset.mp4" loop playsinline webkit-playsinline muted></video>

    <a-scene
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false;"
        arjs='sourceType: webcam; debugUIEnabled: false;'
        renderer="logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true;" 
        id="scene" embedded gesture-detector
    >
        <a-assets>
            <a-asset-item id="miModelo" src="assets/mi-modelo.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 1; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 1.5;" position="2 4 4"></a-entity>

        <a-marker type="pattern" preset="custom" url="assets/marker.patt" videohandler id="markerA"></a-marker>

        <a-entity camera>
            <a-entity id="gui-container" visible="false" position="0 0 -2">
                <a-entity 
                    id="rotation-container"
                    class="clickable"
                    gesture-handler="minScale: 0.1; maxScale: 5; rotationFactor: 1;"
                >
                    <a-entity
                        id="animatedModel"
                        gltf-model="#miModelo"
                        scale="0.01 0.01 0.01" 
                        position="0 0 0" 
                        rotation="0 0 0"
                        animation-mixer="loop: repeat" 
                    ></a-entity>
                </a-entity>
            </a-entity>
        </a-entity>
    </a-scene>
</body>
</html>

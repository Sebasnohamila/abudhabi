<!doctype html>
<html>
<head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: white; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1s ease-out;
        }
        #splash-screen img { max-width: 60%; height: auto; }
        .arjs-ready #splash-screen { opacity: 0; pointer-events: none; }

        /* Contenedor para manejar la rotación Landscape */
        #video-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: black;
            overflow: hidden;
        }

        #fullScreenVideo {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantiene la resolución y proporción original */
        }

        /* Si el móvil está en vertical, rotamos el video para que parezca Landscape */
        @media screen and (orientation: portrait) {
            #fullScreenVideo {
                width: 100vh;
                height: 100vw;
                transform: rotate(90deg);
                transform-origin: center;
                position: absolute;
                top: 50%;
                left: 50%;
                margin-top: -50vw;
                margin-left: -50vh;
                object-fit: cover;
            }
        }

        .a-canvas {
            z-index: 2 !important;
        }
    </style>

    <script>
        AFRAME.registerComponent('videohandler', {
            init: function () {
                var marker = this.el;
                this.vid = document.querySelector("#fullScreenVideo");
                this.container = document.querySelector("#video-container");
                this.modelContainer = document.querySelector("#gui-container"); 

                marker.addEventListener('markerFound', function () {
                    this.container.style.display = 'block';
                    this.vid.play();
                    this.modelContainer.setAttribute('visible', 'true');
                }.bind(this));
            },
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">
    <div id="splash-screen"><img src="assets/logo.png" alt="Cargando..."></div>

    <div id="video-container">
        <video id="fullScreenVideo" src="assets/asset.mp4" loop playsinline webkit-playsinline></video>
    </div>

    <a-scene
        vr-mode-ui="enabled: false"
        arjs='sourceType: webcam; debugUIEnabled: false;'
        renderer="logarithmicDepthBuffer: true; colorManagement: true;" 
        id="scene" embedded gesture-detector
    >
        <a-assets>
            <a-asset-item id="miModelo" src="assets/mi-modelo.glb"></a-asset-item>
        </a-assets>

        <a-marker type="pattern" preset="custom" url="assets/marker.patt" videohandler id="markerA"></a-marker>

        <a-entity camera>
            <a-entity id="gui-container" visible="false" position="0 0 -2">
                <a-entity id="rotation-container" class="clickable" gesture-handler>
                    <a-entity
                        id="animatedModel"
                        gltf-model="#miModelo"
                        scale="0.005 0.005 0.005" 
                        position="0 0 0" 
                        animation-mixer="loop: repeat" 
                    ></a-entity>
                </a-entity>
            </a-entity>
        </a-entity>
    </a-scene>
</body>
</html>

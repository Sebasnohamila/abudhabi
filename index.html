<!doctype html>
<html>
<head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black; /* Filos negros */
        }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: white; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1s ease-out;
        }
        #splash-screen img { max-width: 60%; height: auto; }
        .arjs-ready #splash-screen { opacity: 0; pointer-events: none; }

        /* --- CAMBIO 1: SIMPLIFICACIÓN DEL VIDEO --- */
        /* Eliminamos rotaciones forzadas. Dejamos que ocupe la pantalla de forma natural */
        #fullScreenVideo {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 'contain' asegura que se vea entero, rellenando con negro si es necesario */
            object-fit: contain;
            z-index: 1;
            background-color: black;
        }

        .a-canvas {
            z-index: 2 !important;
        }
    </style>

    <script>
        // Componente existente para manejar el video al encontrar el marker
        AFRAME.registerComponent('videohandler', {
            init: function () {
                var marker = this.el;
                this.vid = document.querySelector("#fullScreenVideo");
                this.modelContainer = document.querySelector("#gui-container");

                marker.addEventListener('markerFound', function () {
                    this.vid.style.display = 'block';
                    this.vid.play().catch(e => console.log("Error play:", e));
                    this.modelContainer.setAttribute('visible', 'true');
                }.bind(this));

                marker.addEventListener('markerLost', function () {
                   // Opcional: this.vid.pause();
                }.bind(this));
            },
        });

        // --- CAMBIO 2: NUEVO COMPONENTE PARA TRANSPARENCIA ---
        AFRAME.registerComponent('model-transparency', {
            schema: { default: 0.5 }, // Valor de opacidad por defecto (0.0 a 1.0)
            init: function () {
                // Esperamos a que el modelo GLB termine de cargar
                this.el.addEventListener('model-loaded', this.updateOpacity.bind(this));
            },
            updateOpacity: function () {
                const mesh = this.el.getObject3D('mesh');
                if (!mesh) return;
                // Recorremos todos los materiales dentro del modelo 3D
                mesh.traverse((node) => {
                    if (node.isMesh) {
                        // Activamos la transparencia y asignamos el valor
                        node.material.transparent = true;
                        node.material.opacity = this.data;
                        // 'depthWrite: false' ayuda a que la transparencia se vea mejor en 3D complejo
                        node.material.depthWrite = false; 
                    }
                });
            }
        });

        window.addEventListener('arjs-video-loaded', function(e) {
            setTimeout(() => { document.body.classList.add('arjs-ready'); }, 1000);
        });
    </script>
</head>

<body>
    <div id="splash-screen"><img src="assets/logo.png" alt="Cargando..."></div>

    <video
        id="fullScreenVideo"
        src="assets/asset.mp4"
        loop
        playsinline
        webkit-playsinline
        muted
        crossorigin="anonymous">
    </video>

    <a-scene
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false;"
        arjs='sourceType: webcam; debugUIEnabled: false;'
        renderer="logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true;"
        id="scene" embedded gesture-detector
    >
        <a-assets>
            <a-asset-item id="miModelo" src="assets/mi-modelo.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 1; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 1.5;" position="2 4 4"></a-entity>

        <a-marker type="pattern" preset="custom" url="assets/marker.patt" videohandler id="markerA">
            <a-entity id="gui-container" visible="false">
                <a-entity
                    id="rotation-container"
                    class="clickable"
                    gesture-handler="minScale: 0.1; maxScale: 5; rotationFactor: 1;"
                >
                    <a-entity
                        id="animatedModel"
                        gltf-model="#miModelo"
                        scale="0.002875 0.002875 0.002875"
                        rotation="0 90 0"
                        animation-mixer="loop: repeat"
                        model-transparency="0.5"
                    ></a-entity>
                </a-entity>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>

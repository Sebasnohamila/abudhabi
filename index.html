<!doctype html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        /* Splash screen y botón de inicio */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: white; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #splash-screen img { max-width: 40%; height: auto; margin-bottom: 20px; }
        
        button {
            padding: 15px 30px; font-size: 18px; cursor: pointer;
            background: #ff0000; color: white; border: none; border-radius: 5px;
        }

        /* Contenedor Video Landscape */
        #video-container {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; z-index: 1; background: black;
        }

        #fullScreenVideo { width: 100%; height: 100%; object-fit: contain; }

        @media screen and (orientation: portrait) {
            #fullScreenVideo {
                width: 100vh; height: 100vw; transform: rotate(90deg);
                transform-origin: center; position: absolute;
                top: 50%; left: 50%; margin-top: -50vw; margin-left: -50vh;
                object-fit: cover;
            }
        }

        .a-canvas { z-index: 2 !important; }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">
    <div id="splash-screen">
        <img src="assets/logo.png" alt="Logo">
        <button id="start-btn">EMPEZAR RA</button>
    </div>

    <div id="video-container">
        <video id="fullScreenVideo" src="assets/asset.mp4" loop playsinline webkit-playsinline></video>
    </div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    >
        <a-assets>
            <a-asset-item id="miModelo" src="assets/mi-modelo.glb"></a-asset-item>
        </a-assets>

        <a-marker type="pattern" url="assets/marker.patt" id="markerA">
            </a-marker>

        <a-entity camera>
            <a-entity id="gui-container" visible="false" position="0 0 -2">
                <a-entity
                    id="animatedModel"
                    gltf-model="#miModelo"
                    scale="0.005 0.005 0.005" 
                    animation-mixer
                ></a-entity>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        const btn = document.querySelector('#start-btn');
        const splash = document.querySelector('#splash-screen');
        const marker = document.querySelector('#markerA');
        const video = document.querySelector('#fullScreenVideo');
        const videoCont = document.querySelector('#video-container');
        const modelCont = document.querySelector('#gui-container');

        // 1. Quitar splash al hacer click (desbloquea el video)
        btn.addEventListener('click', () => {
            splash.style.display = 'none';
            // Intentar un play/pause mudo para "despertar" al navegador
            video.play().then(() => {
                video.pause();
            }).catch(e => console.log("Video esperando marcador"));
        });

        // 2. Lógica de detección
        marker.addEventListener('markerFound', () => {
            videoCont.style.display = 'block';
            video.play();
            modelCont.setAttribute('visible', 'true');
        });

        marker.addEventListener('markerLost', () => {
            // Opcional: ocultar si se pierde el marcador
            // videoCont.style.display = 'none';
            // video.pause();
        });
    </script>
</body>
</html>
